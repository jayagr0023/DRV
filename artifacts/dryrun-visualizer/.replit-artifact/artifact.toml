kind = "web"
previewPath = "/"
title = "DryRun Visualizer"
description = "A Java learning workspace for students to edit short programs, provide standard input, and inspect execution step by step through variables, the call stack, heap objects, and output."
version = "1.0.0"
id = "artifacts/dryrun-visualizer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18670

[services.development]
run = "npm run dev --workspace=@workspace/dryrun-visualizer"

[services.production]
build = [ "npm", "run", "build", "--workspace=@workspace/dryrun-visualizer" ]
serve = "static"
publicDir = "artifacts/dryrun-visualizer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18670"
BASE_PATH = "/"
